<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prompt Engineering Training — Detector Inspector</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --di-purple: #5000B3;
    --di-purple-deep: #3B0086;
    --di-orange: #FF6300;
    --di-orange-deep: #E84500;
    --di-ink: #181818;
    --di-grey-mid: #999999;
    --di-grey-light: #F4F4F4;
    --di-grey-line: #E8E8E8;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; font-family: 'Roboto', Arial, sans-serif; font-size: 16px;
    color: var(--di-ink); background: #fff;
  }
  h1, h2, h3 { font-weight: 700; margin: 0; }
  p { line-height: 1.65; color: #333; }
  button { font-family: 'Roboto', Arial, sans-serif; }
  a.link-btn { color: var(--di-purple); font-size: 13.5px; cursor: pointer; text-decoration: underline; }

  #app { min-height: 100vh; display: flex; flex-direction: column; }

  #cover {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: var(--di-purple); color: #fff; text-align: center; padding: 60px 24px;
  }
  #cover img { width: 150px; margin-bottom: 36px; }
  #cover h1 { font-size: 30px; max-width: 520px; margin-bottom: 36px; }

  /* Lesson menu */
  #menu { flex: 1; display: none; flex-direction: column; }
  .menu-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 24px 40px 0;
  }
  .menu-header img { height: 22px; }
  .menu-wrap { flex: 1; max-width: 680px; margin: 0 auto; padding: 30px 40px 40px; width: 100%; }
  .menu-wrap h2 { font-size: 26px; margin-bottom: 4px; }
  .menu-sub { color: #666; font-size: 14px; margin-bottom: 24px; }
  .lesson-row {
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    padding: 18px 4px; border-top: 1px solid var(--di-grey-line); cursor: pointer;
  }
  .lesson-row:last-child { border-bottom: 1px solid var(--di-grey-line); }
  .lesson-row:hover .lesson-title { color: var(--di-purple); }
  .lesson-row-left { display: flex; align-items: center; gap: 16px; }
  .lesson-num {
    width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 700; flex-shrink: 0; border: 1.5px solid var(--di-grey-line); color: var(--di-grey-mid);
  }
  .lesson-num.done { background: #1E8E3E; border-color: #1E8E3E; color: #fff; }
  .lesson-title { font-size: 15.5px; font-weight: 500; }
  .lesson-status { font-size: 12.5px; color: var(--di-grey-mid); margin-top: 2px; }
  .lesson-status.done { color: #1E8E3E; }
  .chevron { color: var(--di-grey-mid); font-size: 18px; }

  .progress-track { height: 3px; background: var(--di-grey-line); }
  .progress-fill { height: 100%; background: var(--di-orange); transition: width .25s ease; }

  .chrome-header { display: flex; align-items: center; justify-content: space-between; padding: 20px 40px 0; }
  .chrome-header img { height: 22px; }
  .step-label { font-size: 12px; color: var(--di-grey-mid); font-weight: 500; letter-spacing: .02em; }
  .chrome-footer { display: flex; align-items: center; justify-content: space-between; padding: 18px 40px; margin-top: auto; }
  .chrome-footer img { height: 18px; opacity: 0.7; }
  .chrome-footer .date-stamp { font-size: 11.5px; color: var(--di-grey-mid); }

  #wizard { flex: 1; display: none; flex-direction: column; }
  .content-wrap { flex: 1; max-width: 640px; margin: 0 auto; padding: 44px 40px 20px; width: 100%; }
  .tag { font-size: 11.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--di-orange-deep); margin-bottom: 12px; display: block; }
  .content-wrap h2 { font-size: 26px; margin-bottom: 4px; }
  .rule { width: 40px; height: 3px; background: var(--di-orange); margin: 14px 0 22px; border: none; }
  .lede { font-size: 16px; color: #444; margin-bottom: 8px; }

  .outline-list { margin-top: 26px; }
  .outline-item { display: flex; align-items: baseline; gap: 16px; padding: 16px 0; border-top: 1px solid var(--di-grey-line); }
  .outline-item:last-child { border-bottom: 1px solid var(--di-grey-line); }
  .outline-num { font-size: 13px; color: var(--di-grey-mid); font-weight: 700; min-width: 20px; }
  .outline-name { font-size: 16px; font-weight: 500; }

  .detail-section { margin-top: 28px; }
  .detail-label { font-size: 11.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--di-grey-mid); margin-bottom: 8px; }
  .detail-example { font-size: 14.5px; color: #333; background: var(--di-grey-light); padding: 14px 16px; border-radius: 8px; font-style: italic; }
  .pros-cons { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; margin-top: 6px; }
  @media (max-width: 560px) { .pros-cons { grid-template-columns: 1fr; gap: 18px; } }
  .pros-cons ul { margin: 0; padding-left: 18px; font-size: 14.5px; color: #333; }
  .pros-cons li { margin-bottom: 6px; }
  .pc-heading { font-size: 12.5px; font-weight: 700; margin-bottom: 8px; }
  .pc-heading.pro { color: #1E8E3E; }
  .pc-heading.con { color: var(--di-orange-deep); }
  .differentiation-text { font-size: 14.5px; color: #333; }

  table.compare-table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 13.5px; }
  table.compare-table th { text-align: left; padding: 8px 14px 8px 0; font-size: 11.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--di-grey-mid); border-bottom: 2px solid var(--di-ink); }
  table.compare-table td { padding: 16px 14px 16px 0; border-bottom: 1px solid var(--di-grey-line); vertical-align: top; }
  table.compare-table td:first-child { color: #666; }

  .why-block { font-size: 16.5px; line-height: 1.7; color: #222; }
  .why-block strong { color: var(--di-purple); }

  .nav-row { display: flex; align-items: center; justify-content: space-between; padding: 20px 40px 8px; max-width: 640px; margin: 0 auto; width: 100%; gap: 12px; }
  .btn-text { background: none; border: none; color: var(--di-grey-mid); font-size: 14px; font-weight: 500; cursor: pointer; padding: 10px 4px; }
  .btn-text:hover { color: var(--di-ink); }
  .btn-text:disabled { visibility: hidden; }
  .btn-solid { background: var(--di-orange); color: #fff; border: none; font-weight: 700; font-size: 14.5px; padding: 12px 26px; border-radius: 10px; cursor: pointer; transition: background .15s; }
  .btn-solid:hover { background: var(--di-orange-deep); }
  .btn-solid:disabled { background: #D9D9D9; color: #999; cursor: not-allowed; }
  .btn-outline { background: none; border: 1.5px solid var(--di-ink); color: var(--di-ink); font-weight: 700; font-size: 14.5px; padding: 11px 24px; border-radius: 10px; cursor: pointer; }
  .btn-outline:hover { background: var(--di-ink); color: #fff; }

  .quiz-question .q-title { font-weight: 500; font-size: 17px; margin-bottom: 18px; line-height: 1.5; }
  .option { display: flex; align-items: center; gap: 12px; padding: 14px 4px; border-bottom: 1px solid var(--di-grey-line); cursor: pointer; font-size: 14.5px; }
  .option:first-of-type { border-top: 1px solid var(--di-grey-line); }
  .option .dot { width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid #BBB; flex-shrink: 0; position: relative; }
  .option.selected .dot { border-color: var(--di-purple); }
  .option.selected .dot::after { content: ""; position: absolute; inset: 3px; border-radius: 50%; background: var(--di-purple); }
  .option.selected { color: var(--di-purple); font-weight: 500; }

  .review-answer-item { padding: 18px 0; border-top: 1px solid var(--di-grey-line); }
  .review-answer-item:last-child { border-bottom: 1px solid var(--di-grey-line); }
  .review-answer-q { font-size: 14.5px; font-weight: 500; margin-bottom: 6px; }
  .review-answer-a { font-size: 14px; color: var(--di-purple); }
  .review-answer-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; }

  .score-ring-wrap { position: relative; width: 160px; height: 160px; margin: 0 auto 24px; }
  .score-ring-wrap svg { transform: rotate(-90deg); width: 100%; height: 100%; }
  .ring-track { fill: none; stroke: var(--di-grey-line); stroke-width: 10; }
  .ring-fill { fill: none; stroke-width: 10; stroke-linecap: round; transition: stroke-dashoffset 0.7s cubic-bezier(.4,0,.2,1), stroke 0.3s ease; }
  .ring-fill.pass { stroke: #1E8E3E; }
  .ring-fill.fail { stroke: var(--di-orange-deep); }
  .ring-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .ring-score { font-size: 34px; font-weight: 700; line-height: 1; }
  .ring-score.pass { color: #1E8E3E; }
  .ring-score.fail { color: var(--di-orange-deep); }
  .ring-label { font-size: 12px; color: var(--di-grey-mid); margin-top: 5px; }

  #step-results .content-wrap { text-align: center; }
  .review-list { text-align: left; margin-top: 30px; }
  .review-item { display: flex; gap: 10px; padding: 12px 0; border-top: 1px solid var(--di-grey-line); font-size: 13.5px; }
  .review-item .mark { font-weight: 700; flex-shrink: 0; }
  .review-item.right .mark { color: #1E8E3E; }
  .review-item.wrong .mark { color: var(--di-orange-deep); }
  .review-item em { color: #666; font-style: normal; }

  #step-complete .content-wrap { text-align: center; }
  .nav-row.centered-actions { justify-content: center; }
</style>
</head>

<script>
  var LESSONS = [{"id": 1, "title": "Basic Prompt Structure", "blurb": "Every effective prompt is made of up to four ingredients. Most people only ever use one — the task — and leave Claude to guess the rest.", "sections": [{"name": "Task", "definition": "What you want Claude to do — the action itself, stated as one clear instruction.", "example": "“Summarize this email in 3 bullet points.” &mdash; not “Look at this email.”", "pros": ["Anchors everything else in the prompt — without it, nothing has a purpose", "Cheap to add: costs one clear sentence"], "cons": ["Asking two things in one task line splits Claude's focus", "Too narrow a task can make Claude ignore useful context you've given"], "differentiation": "Task is the <strong>what</strong>, not the <em>why</em> (that's context) or the <em>shape</em> the answer should take (output format)."}, {"name": "Context", "definition": "Background information that shapes judgment — who it's for, why you're asking, what matters.", "example": "“This is for a client who's non-technical” changes word choice even for an identical task.", "pros": ["Lets Claude make the same judgment calls you would", "The single biggest lever for a genuinely useful answer"], "cons": ["Irrelevant context can bury the actual task", "Context that contradicts the task creates confusion"], "differentiation": "Context <strong>frames</strong> interpretation — it isn't itself acted on, unlike input data."}, {"name": "Output format", "definition": "How the answer should look — length, structure, style.", "example": "“3 bullets, under 50 words” vs. leaving Claude to guess the shape of the answer.", "pros": ["Removes formatting guesswork entirely", "Valuable when output has to fit somewhere specific"], "cons": ["Over-specifying format on a simple answer can add unnecessary rigidity"], "differentiation": "Output format is about <strong>shape</strong>, not content."}, {"name": "Input data", "definition": "The actual raw material Claude works on — text, code, data — clearly separated from your instructions.", "example": "Labelling <code>Email: [text]</code> at the end, distinct from the instructions above it.", "pros": ["Prevents Claude mistaking content in the data for commands", "Crucial once content gets longer or messier"], "cons": ["Pasting data unlabeled invites confusion"], "differentiation": "Input data is the <strong>raw material</strong>, the opposite job from context."}], "examples": [{"weak": "“Summarize this email.”", "strong": "“Summarize the email below for my manager, who only reads bullet points. 3 bullets, under 50 words.<br><br>Email: [text]”"}, {"weak": "“Write about dogs.”", "strong": "“Write a 200-word intro comparing Labradors and Poodles, for first-time owners deciding between the two.”"}, {"weak": "“Fix this code.”", "strong": "“This function throws an error on empty input. Add a check that returns an empty array instead.<br><br>Code: [snippet]”"}], "why": "A vague prompt forces Claude to guess your intent, your audience, and your format. A structured one removes the guesswork.<br><br><strong>This is the foundation everything else sits on.</strong> Every technique later in this course is really just adding more of these four ingredients, more precisely.", "questions": [{"q": "What are the four elements of a well-structured prompt?", "options": ["Task, context, output format, input data", "Task, greeting, apology, output", "Context, opinion, feedback, closing", "Input data, output data, metadata, footnotes"], "correct": 0}, {"q": "What role does “context” play in a prompt?", "options": ["It's the raw content Claude works on", "It's background information that shapes how Claude approaches the task", "It's the exact word count required", "It's a greeting at the start of the prompt"], "correct": 1}, {"q": "Where should input data usually go, and how?", "options": ["At the very beginning, before the task", "Anywhere — order never matters", "Last, clearly labelled and separated from the instructions", "Folded silently into the task sentence"], "correct": 2}, {"q": "A prompt like “Make this better” is a problem mainly because it…", "options": ["is too short to be polite", "forces Claude to guess judgment calls you already know the answer to", "doesn't use enough exclamation marks", "is missing a greeting"], "correct": 1}]}, {"id": 2, "title": "Being Clear and Direct", "blurb": "Claude can't read your mind, only your words. Vague prompts force Claude to guess things you already know — replace judgment calls with specifics.", "sections": [{"name": "The Stranger Test", "definition": "If a thoughtful stranger reading your prompt cold would have follow-up questions before starting, Claude will silently guess the same way — except you won't see the guess, just an answer that missed.", "example": "“Make this better” could mean shorter, friendlier, more formal, more persuasive. You know which one you mean; a vague prompt forces Claude to pick.", "pros": ["Simple, quick self-check before sending any prompt", "Catches ambiguity you didn't notice you'd left in"], "cons": ["Doesn't tell you *what* to add — just that something's missing"], "differentiation": "This is a diagnostic, not a technique on its own — it tells you when to apply Lesson 1's four elements more precisely."}, {"name": "Over-specifying is safe", "definition": "Claude won't be annoyed by a highly detailed prompt — it performs better with more detail, not less.", "example": "A highly detailed prompt with role, context, format, and examples all included outperforms a short one, even though it's longer.", "pros": ["Removes the temptation to under-specify out of politeness"], "cons": ["Detail should still be relevant — padding with irrelevant detail doesn't help"], "differentiation": "Different from output format (Lesson 5) — this is about instruction clarity, not answer shape."}], "examples": [{"weak": "“Make this better.”", "strong": "“Make this email more concise and less formal.”"}, {"weak": "“Fix this code.”", "strong": "“This function throws an error on empty input — add a check that returns an empty array instead.”"}], "why": "Vagueness is the single biggest cause of a missed answer — more than any missing advanced technique. Every other lesson in this course only works once the core instruction itself is clear.", "questions": [{"q": "What's the main problem with a vague prompt like “make this better”?", "options": ["It's too polite", "It forces Claude to guess judgment calls you already know the answer to", "It's too short to process", "It uses the wrong punctuation"], "correct": 1}, {"q": "What's a good test for whether a prompt is vague?", "options": ["Whether it's under 10 words", "Whether a thoughtful stranger reading it cold would have follow-up questions", "Whether it uses bullet points", "Whether it's addressed to “Claude” directly"], "correct": 1}, {"q": "Does Claude get worse results from a highly detailed, longer prompt?", "options": ["Yes, always keep it under 10 words", "No — it generally performs better with relevant detail, not less", "Only for coding tasks", "Only if written in bullet points"], "correct": 1}, {"q": "Which is the clearer, more direct rewrite of “write about dogs”?", "options": ["“Write something about dogs, make it nice”", "“A 200-word intro comparing Labradors and Poodles, for first-time owners”", "“Dogs: a summary”", "“Tell me about dogs in general”"], "correct": 1}]}, {"id": 3, "title": "Assigning Roles", "blurb": "Telling Claude who to be for a task changes the vocabulary, priorities, and judgment it applies — even when the instruction stays the same.", "sections": [{"name": "What a role actually changes", "definition": "A role isn't flavor — it changes what Claude notices, what it treats as important, and what “good” looks like for the task.", "example": "“Review this contract” gets a generic pass. “You're a contracts lawyer specializing in vendor agreements. Review this contract” flags liability clauses and termination terms a generic read skips.", "pros": ["Compresses a whole set of priorities into one short phrase", "Especially strong for specialized judgment: legal, medical, financial, technical review"], "cons": ["A vague role (“world-class expert in everything”) narrows nothing — it's flattery, not a role"], "differentiation": "Role is a compressed form of <strong>context</strong> (Lesson 1) — it implies a set of priorities you'd otherwise spell out sentence by sentence."}, {"name": "When it doesn't help", "definition": "On simple factual questions, a role changes tone at most, not the answer — a fact is a fact regardless of who's answering.", "example": "“You're a geography professor. What's the capital of France?” returns the same fact as asking plain.", "pros": ["Recognizing this saves you from padding every prompt with an unnecessary role"], "cons": ["Easy to over-apply out of habit once you've seen it work elsewhere"], "differentiation": "The test is the same one from Lesson 1: is there a judgment call for the role to shape, or just a fact to retrieve?"}, {"name": "Switching roles mid-conversation", "definition": "Claude follows whatever role is stated in the current message — it doesn't lock into the first role forever, but tone can bleed across turns if you don't restate it.", "example": "If you were “a blunt code reviewer” two messages ago and now want “a supportive mentor,” say so explicitly.", "pros": ["Lets you use different lenses at different points in one project — engineer hat, then PM hat"], "cons": ["Assuming the role carries over silently can cause inconsistent tone"], "differentiation": "Different from asking for multiple stakeholder views in one answer — that's several roles inside a single response, not a switch between messages."}], "examples": [{"weak": "“Tell me how to build an LMS.” (role: LMS Administrator)", "strong": "“Tell me how to build an LMS.” (role: instructional designer specializing in corporate e-learning) — the second role actually matches the judgment the task needs: pacing and engagement, not backend admin."}, {"weak": "“Review this contract.”", "strong": "“You're a contracts lawyer specializing in vendor agreements. Review this contract for liability and termination risk.”"}], "why": "A role only earns its keep when it matches the judgment the task actually needs — not when it merely sounds plausible. Picking the *right* role is the actual skill, more than remembering to add one at all.", "questions": [{"q": "What does assigning a role actually change about Claude's output?", "options": ["Only the length of the answer", "Vocabulary, priorities, and what judgment calls get made", "Nothing measurable", "Only whether emojis are used"], "correct": 1}, {"q": "Does a role help much on a simple factual question like “what's the capital of France”?", "options": ["Yes, always add one", "No — there's no judgment call for the role to shape", "Only if the role is a professor", "Only for questions about Europe"], "correct": 1}, {"q": "When switching roles between messages, what should you do?", "options": ["Nothing, Claude remembers automatically forever", "State the role again — don't assume it silently carries over", "Start a completely new conversation each time", "Only assign roles once per day"], "correct": 1}, {"q": "Why was “LMS Administrator” a weak role for designing a training course?", "options": ["It's not a real job title", "It matched the wrong kind of judgment — admin/backend rather than instructional design", "It's too long to type", "It was spelled incorrectly"], "correct": 1}]}, {"id": 4, "title": "Separating Data from Instructions", "blurb": "When a prompt includes real content to work on, that content needs to be clearly marked off from your instructions — otherwise Claude can't always tell where one ends and the other begins.", "sections": [{"name": "Labeled block", "definition": "A simple label before the content, e.g. <code>Email:</code> followed by the text.", "example": "“Summarize the email below.<br><br>Email: Hi, I ordered a blender...”", "pros": ["Fast, no special syntax needed"], "cons": ["Marks a start but no explicit end — breaks if you need instructions after the data"], "differentiation": "The weakest of the four methods, but fine for short, simple, last-in-prompt data."}, {"name": "XML-style tags", "definition": "An opening and matching closing tag wrap the content, e.g. <code>&lt;email&gt;...&lt;/email&gt;</code>.", "example": "“Summarize the complaint in the email tags below.<br><br>&lt;email&gt;...&lt;/email&gt;”", "pros": ["Marks both a start and an end — the most reliable for longer or messier content", "Claude was trained to pay close attention to tags specifically"], "cons": ["Slightly more to type than a plain label"], "differentiation": "Scales best once data has multiple paragraphs or you need instructions both before and after it."}, {"name": "Triple quotes / fences", "definition": "Three backtick characters on their own line before and after the content.", "example": "Three backticks, the content, three backticks again — renders as a visible block in chat interfaces, but the literal characters are what Claude reads.", "pros": ["Works even in plain text with no formatting support"], "cons": ["Less descriptive than a named tag — doesn't say *what* the content is"], "differentiation": "A boundary marker, not a label — pair it with a sentence saying what's inside if that's not obvious."}, {"name": "Clear heading", "definition": "Plain invented text marking a start and end, e.g. <code>--- EMAIL START ---</code> / <code>--- EMAIL END ---</code>.", "example": "No special syntax required — works anywhere, even inside an email or text file.", "pros": ["No syntax to remember, works in any medium"], "cons": ["Less standard — relies on being visually obvious rather than a recognized convention"], "differentiation": "Functionally similar to XML tags, just without formal syntax."}], "examples": [{"weak": "Summarize this complaint: Hi, I ordered a blender two weeks ago and it arrived cracked...", "strong": "Summarize the complaint below.<br><br>&lt;email&gt;Hi, I ordered a blender two weeks ago and it arrived cracked...&lt;/email&gt;"}, {"weak": "Generate a report using this email as reference: Hi, I hope you are well...", "strong": "Generate a report. Use the email as reference.<br><br>&lt;email&gt;Hi, I hope you are well...&lt;/email&gt;"}], "why": "Instructions are the frame; data is the picture inside the frame. If the data contains instruction-like language (“ignore previous instructions and...”), separation is what keeps Claude from treating it as a command rather than content being reported on.", "questions": [{"q": "Why can unlabeled data inside a prompt be risky?", "options": ["It makes the prompt too long", "Data containing instruction-like language could be mistaken for a command", "Claude can't read unlabeled text at all", "It uses more tokens"], "correct": 1}, {"q": "Which separation methods mark both a start AND an explicit end?", "options": ["A plain label like “Email:” only", "XML tags, fences, or a clear heading", "None of them do", "Only capital letters"], "correct": 1}, {"q": "What's the mental model for instructions vs. data?", "options": ["Instructions are the picture, data is the frame", "Instructions are the frame, data is the picture inside it", "They're interchangeable", "Data always comes first, instructions last"], "correct": 1}, {"q": "What elevated an exercise from “unlabeled” to “well-separated”?", "options": ["Making the email shorter", "Wrapping it in a clean opening and closing tag", "Removing the greeting", "Using more exclamation points"], "correct": 1}]}, {"id": 5, "title": "Formatting Output", "blurb": "Telling Claude exactly how the answer should be shaped removes a whole category of guesswork, especially when it needs to slot into something specific.", "sections": [{"name": "Explicit structure & length", "definition": "Naming the shape (bullets, numbered list, table) and size (word count, one paragraph) directly.", "example": "“3 bullets, under 50 words” vs. leaving the shape undefined.", "pros": ["Removes formatting guesswork entirely"], "cons": ["Over-specifying on a short, simple answer can feel rigid"], "differentiation": "Shape, not content — the same facts can be packaged completely differently without changing what's true."}, {"name": "Exact templates", "definition": "Showing the precise pattern you want filled in, rather than describing it in words.", "example": "“Format each entry like this: <strong>Name</strong> — Role<br>One-line summary”", "pros": ["More reliable than a prose description — zero interpretation required"], "cons": ["Only works if you actually know the shape you want in advance"], "differentiation": "A preview of Lesson 7 (examples) — showing instead of describing."}, {"name": "Structured data (XML/JSON)", "definition": "Output shaped for a program to read, not a person — every entry gets an identical, predictable structure.", "example": "A list of people as JSON objects with identical keys (name, role, email) instead of inconsistent prose per entry.", "pros": ["A program can reliably grab the same field every time"], "cons": ["Overkill and harder to read if a human is the actual audience"], "differentiation": "Only worth it when the output is going *into* something else — a script, a spreadsheet, an app."}], "examples": [{"weak": "“Explain the pros and cons of remote work.”", "strong": "“Explain the pros and cons of remote work as a table with two columns: Pros and Cons.”"}, {"weak": "“List some people with their info.”", "strong": "“For each person, use exactly this format: **Name** — Role — one-line note.”"}], "why": "If Claude gives you the right content in the wrong shape, that's almost always a missing output-format instruction — not a factual mistake. Format and content are separate levers you control independently.", "questions": [{"q": "What's the relationship between content and format?", "options": ["They're the same thing", "The same underlying facts can be packaged in different shapes without changing what's true", "Format always changes the facts", "Format only matters for code"], "correct": 1}, {"q": "What's often more reliable than describing a format in words?", "options": ["Using more adjectives", "Showing an exact template for Claude to fill in", "Asking twice", "Writing in all capitals"], "correct": 1}, {"q": "Why would you ask for JSON or XML output instead of plain prose?", "options": ["It looks more advanced", "So a program can reliably parse the same fields every time", "It's always more readable for humans", "It's required for short answers"], "correct": 1}, {"q": "If Claude gives correct facts but in the wrong shape, what's usually missing?", "options": ["More context about the facts", "An output-format instruction", "A role assignment", "Nothing — that's expected"], "correct": 1}]}, {"id": 6, "title": "Chain-of-Thought", "blurb": "For tasks involving reasoning or trade-offs, asking Claude to think step-by-step before answering tends to produce more accurate, reliable results than asking for the answer directly.", "sections": [{"name": "Where it matters most", "definition": "Math, multi-step logic, trade-off decisions, and diagnosing why something failed all benefit — anywhere a reasoning chain exists to walk through.", "example": "A word problem solved step by step catches errors a jumped-to answer would miss.", "pros": ["Each step builds on the last, surfacing mistakes before they reach the final answer"], "cons": ["Doesn't help where there's no real reasoning chain — a fact lookup has nothing to walk through"], "differentiation": "The test mirrors Lesson 3's role test: is there genuine judgment happening, or just retrieval?"}, {"name": "Where it's overkill", "definition": "Simple factual lookups and already-rigid templated outputs don't benefit — forcing reasoning steps in can clutter the result.", "example": "“What's the capital of France, think step by step” adds nothing — there's no chain to walk.", "pros": ["Knowing when to skip it keeps answers clean and fast"], "cons": ["Easy to reflexively add it everywhere once you've seen it work"], "differentiation": "Corporate ops nuance: analysis and conclusions benefit; pure formatting or retrieval tasks don't."}, {"name": "CoT + strict templates", "definition": "Asking for both reasoning AND a rigid format in one instruction can create tension — reasoning either breaks the template or gets squeezed in awkwardly.", "example": "“Simple text output” plus “step by step before the final answer” can be read two ways: reasoning-as-thinking, or the deliverable itself.", "pros": ["Recognizing the conflict early avoids a muddled result"], "cons": ["Easy to accidentally conflate the two meanings in one sentence"], "differentiation": "Fixed the same way as Lesson 4: separate with tags — reason inside &lt;reasoning&gt;, final answer inside &lt;answer&gt;."}], "examples": [{"weak": "“A store has 120 items, sells 35% then 20% of what's left. How many remain?”", "strong": "“...Work through this step by step before giving the final answer.”"}, {"weak": "“Should we switch scheduling tools? Give me an answer.”", "strong": "“Reason through the trade-offs step by step, then give a final, clear recommendation.”"}], "why": "When Claude jumps straight to an answer, it commits to a conclusion without laying out reasoning that would catch its own mistakes. Reasoning first is insurance against a shaky final answer — the same way you'd trust your own arithmetic more written out than blurted.", "questions": [{"q": "What kind of tasks benefit most from chain-of-thought?", "options": ["Simple fact lookups", "Reasoning, trade-offs, and multi-step problems", "Requests for a single word answer", "Nothing — it never helps"], "correct": 1}, {"q": "What can go wrong when you combine “think step by step” with a strict output template, without separating them?", "options": ["Nothing, they always work fine together", "The reasoning can break the template or get squeezed in awkwardly", "Claude ignores the template entirely, always", "Claude refuses to answer"], "correct": 1}, {"q": "What's the fix for a chain-of-thought vs. strict-template conflict?", "options": ["Drop chain-of-thought entirely", "Separate them with tags, e.g. reasoning in one section, final answer in another", "Always drop the template instead", "Ask the question twice"], "correct": 1}, {"q": "Does “what's the capital of France” benefit from chain-of-thought?", "options": ["Yes, always add it", "No — there's no reasoning chain to walk through", "Only on Mondays", "Only if asked twice"], "correct": 1}]}, {"id": 7, "title": "Using Examples", "blurb": "Instead of describing the format, tone, or style you want, show Claude one or more examples of it — often more reliable than a written explanation.", "sections": [{"name": "Why examples beat descriptions", "definition": "Words like “professional” or “punchier” are subjective — Claude has to guess your specific version. An example removes that guessing entirely.", "example": "“Rewrite this to be punchier: Before: ‘This blender has a powerful motor.’ After: ‘Blend anything. Any speed.’” shows the pattern instead of naming it.", "pros": ["No interpretation gap between “like this” and an actual sample"], "cons": ["A bad example teaches the wrong pattern just as effectively as a good one teaches the right one"], "differentiation": "One-shot (one example), few-shot (several), zero-shot (none) — what you've done in every exercise until now."}, {"name": "Where it earns its keep", "definition": "Matching a specific tone or brand voice, consistent formatting across many similar items, and edge cases that are hard to explain but easy to show.", "example": "“Classify these as urgent/not urgent” — one example of each does more work than a paragraph defining “urgent.”", "pros": ["Especially strong for voice-matching and edge-case classification"], "cons": ["Less useful for one-off tasks with no repeated pattern"], "differentiation": "Connects to Lesson 5 — this is output-format control taken further: showing instead of describing."}, {"name": "Quality over quantity", "definition": "One sharp, representative example usually beats three mediocre ones.", "example": "A single well-chosen before/after pair teaches the pattern more reliably than several loosely related ones.", "pros": ["Saves time — you don't need many examples, just the right one"], "cons": ["Requires picking a genuinely representative case, not just any example"], "differentiation": "The value is in precision, not volume."}], "examples": [{"weak": "“Rewrite these product descriptions to be punchier.”", "strong": "“Rewrite to be punchier, in this style: Before: [x]. After: [y]. Now rewrite: [your text]”"}, {"weak": "“Draft a professional but informative reply to my supervisor.”", "strong": "“Before: ‘This is the current performance from X.’ After: ‘This is the data we gathered Monday–Friday, showing a positive trend vs. last week.’ Now write the reply in that style.”"}], "why": "Showing removes ambiguity that describing can't. This is the technique most likely to fix a prompt where Claude keeps missing the tone or pattern you're picturing, no matter how you word the description.", "questions": [{"q": "What's it called when you give Claude zero, one, or several examples?", "options": ["Zero-shot, one-shot, few-shot", "Low-res, mid-res, high-res", "Basic, advanced, expert mode", "None of these are real terms"], "correct": 0}, {"q": "Why do examples often beat a written description like “make it punchier”?", "options": ["Examples are always shorter", "They remove the subjective interpretation gap — no guessing what ‘punchier’ means to you", "Claude can't understand adjectives", "Examples take less time to write"], "correct": 1}, {"q": "What matters more — the quality or quantity of your examples?", "options": ["Quantity always wins", "Quality — one sharp example usually beats several mediocre ones", "They don't matter either way", "Exactly three examples is required"], "correct": 1}, {"q": "Where do examples earn their keep the most?", "options": ["Simple factual questions", "Matching tone/voice, consistent formatting, and hard-to-explain edge cases", "Only in coding tasks", "They never really help"], "correct": 1}]}, {"id": 8, "title": "Avoiding Hallucinations", "blurb": "Claude can state something false with the same confidence and fluency as something true. Managing this risk matters more than almost any other technique when real decisions are on the line.", "sections": [{"name": "Give Claude an explicit “out”", "definition": "Telling Claude it's fine to say “I don't know” gives permission to admit uncertainty instead of filling the gap with a guess.", "example": "“If you don't know, say so — don't guess” directly in the prompt.", "pros": ["Turns a silent guess into a visible, honest gap"], "cons": ["Doesn't add the missing information — just stops Claude from inventing it"], "differentiation": "A safety net, not a data source — the real fix for a hallucination risk is usually Lesson 4: provide the actual material."}, {"name": "Ground it & ask for sources", "definition": "Grounding ties directly to Lesson 4 — if real data is in the prompt, labeled and separated, Claude reports on it instead of inventing it. Asking for citations makes any remaining fabrication easier to catch.", "example": "Providing the actual performance data, tagged, rather than asking Claude to “summarize the current performance” with nothing to summarize.", "pros": ["The single most effective mitigation — removes the need to guess at all"], "cons": ["Requires you to actually have and provide the source material"], "differentiation": "This is the difference between an honest refusal and an actually useful answer."}, {"name": "Flag confidence & verify", "definition": "Asking Claude to note where it's uncertain surfaces soft spots instead of hiding them behind confident phrasing. For anything consequential, verify it yourself — no prompting technique eliminates the risk entirely.", "example": "“Note anywhere you're uncertain” as a standing instruction for high-stakes drafts.", "pros": ["Makes the real safety net (human verification) actually possible by flagging where to look"], "cons": ["Still requires you to actually do the verification — the flag alone isn't a guarantee"], "differentiation": "The last line of defense, after grounding and explicit-out have already reduced the risk."}], "examples": [{"weak": "“Summarize the current Jotform performance.” (no data provided)", "strong": "“Summarize the performance below. If anything isn't covered by this data, say so rather than guessing.<br><br>&lt;data&gt;[actual figures]&lt;/data&gt;”"}, {"weak": "“What were our Q3 numbers?”", "strong": "“Based only on the report below, what were our Q3 numbers? Flag anything you're inferring rather than reading directly.<br><br>&lt;report&gt;[text]&lt;/report&gt;”"}], "why": "Hallucination risk rises exactly when a prompt asks for something specific without providing the material to make it true. The more “factual” something sounds — names, numbers, quotes — the more it matters whether Claude actually has the source, or is quietly filling a gap.", "questions": [{"q": "What is a hallucination, in this context?", "options": ["Claude refusing to answer", "Confident, plausible-sounding information that isn't actually grounded in anything real", "A formatting error", "A slow response"], "correct": 1}, {"q": "What does giving Claude an explicit “out” do?", "options": ["Makes Claude search the web automatically", "Gives permission to say ‘I don't know’ instead of guessing", "Ends the conversation", "Removes the need for context"], "correct": 1}, {"q": "What increases hallucination risk the most?", "options": ["Asking overly polite questions", "Asking for specific facts/numbers without providing the actual source material", "Using too many bullet points", "Assigning a role"], "correct": 1}, {"q": "Do these techniques eliminate hallucination risk entirely?", "options": ["Yes, completely, every time", "No — they reduce and surface the risk, not guarantee it away", "Only for math questions", "Only when using JSON output"], "correct": 1}]}, {"id": 9, "title": "Complex Prompts", "blurb": "A strong complex prompt is just the previous 8 lessons layered in the same message — not a new technique, but knowing which combination a task needs.", "sections": [{"name": "A sensible order of operations", "definition": "Role (if specialized judgment is needed) → task → context → reasoning instruction (if there's real judgment) → output format/template → input data, last, clearly separated → a grounding safeguard if facts or real people are involved.", "example": "A report to a supervisor, built from real data, with a judgment call in it, could reasonably use five or six of these at once.", "pros": ["Gives a repeatable checklist rather than starting from a blank page each time"], "cons": ["Not every prompt needs all seven — forcing every technique into a simple task adds clutter"], "differentiation": "This is a sequencing convention, not a rule — the judgment call is which techniques the task actually needs."}, {"name": "When techniques fight each other", "definition": "Combining techniques without separating them can cause them to clash — a reasoning instruction blurring into an output-format instruction, or a role that doesn't match the actual judgment the task needs.", "example": "“Show step by step, output should be simple text” is ambiguous: is step-by-step the reasoning, or the deliverable itself?", "pros": ["Recognizing the failure mode early prevents a muddled prompt"], "cons": ["Easy to miss until you actually see the conflicting output"], "differentiation": "The fix is always the same one from Lesson 4: tags and clear separation, so each instruction stays legible even with several stacked together."}], "examples": [{"weak": "“Review Jotform performance and tell me what's going on.”", "strong": "“Role: Data Analyst. Task: review Jotform performance. Context: for Marcus, Head of Scheduling, to assess status and next steps. Explain your reasoning for each finding. Output: a professional summary, simple wording. &lt;data&gt;[actual figures]&lt;/data&gt;”"}], "why": "Real work rarely needs just one technique in isolation. The actual skill of prompt engineering, by the end of this course, isn't memorizing eight separate tricks — it's recognizing which combination a given task needs, and keeping them from stepping on each other.", "questions": [{"q": "What is a “complex prompt,” really?", "options": ["A prompt with more than 100 words", "Multiple earlier techniques layered together in one message, not a new technique", "A prompt written in a foreign language", "A prompt that requires code"], "correct": 1}, {"q": "What's a sensible rough order of operations for a complex prompt?", "options": ["Random order, it never matters", "Role, task, context, reasoning, format, data (last, separated), grounding", "Always alphabetical", "Data first, everything else after"], "correct": 1}, {"q": "What's the failure mode when combining several techniques in one prompt?", "options": ["The prompt becomes too short", "Techniques can fight each other if not clearly separated", "Claude always ignores extra techniques", "There's no real risk at all"], "correct": 1}, {"q": "What's the fix when techniques start to clash in a complex prompt?", "options": ["Remove all techniques and start over", "Tags and clear separation — the same fix as Lesson 4", "Write the prompt in all capitals", "Ask a completely different question"], "correct": 1}]}];
  var PASS_FRACTION = 0.75;

  var STEPS = [];
  var current = 0;
  var activeLesson = null;
  var quizAnswers = [];
  var lastScore = null;

  function loadProgress() {
    try { return JSON.parse(localStorage.getItem("pe-lms-progress") || "{}"); } catch (e) { return {}; }
  }
  function saveProgress(lessonId, correctCount, total) {
    try {
      var prog = loadProgress();
      var prev = prog[lessonId] || { best: 0, total: total };
      prog[lessonId] = { best: Math.max(prev.best, correctCount), total: total };
      localStorage.setItem("pe-lms-progress", JSON.stringify(prog));
    } catch (e) {}
  }

  function showCover() {
    document.getElementById("cover").innerHTML = document.getElementById("shell-cover").innerHTML;
    document.getElementById("cover").style.display = "flex";
    document.getElementById("menu").style.display = "none";
    document.getElementById("wizard").style.display = "none";
  }

  function showMenu() {
    document.getElementById("cover").style.display = "none";
    document.getElementById("wizard").style.display = "none";
    var menu = document.getElementById("menu");
    menu.style.display = "flex";
    var progress = loadProgress();
    var list = document.getElementById("lessonList");
    list.innerHTML = LESSONS.map(function (lesson) {
      var p = progress[lesson.id];
      var passed = p && (p.best / p.total) >= PASS_FRACTION;
      var status = !p ? "Not started" : (passed ? "Completed \u2014 " + p.best + "/" + p.total : "Best score " + p.best + "/" + p.total + " \u2014 not yet passed");
      return '<div class="lesson-row" data-lesson-id="' + lesson.id + '">' +
        '<div class="lesson-row-left">' +
        '<div class="lesson-num' + (passed ? " done" : "") + '">' + (passed ? "\u2713" : String(lesson.id).padStart(2, "0")) + '</div>' +
        '<div><div class="lesson-title">' + lesson.title + '</div><div class="lesson-status' + (passed ? " done" : "") + '">' + status + '</div></div>' +
        '</div><div class="chevron">\u203a</div></div>';
    }).join("");
    list.querySelectorAll(".lesson-row").forEach(function (row) {
      row.addEventListener("click", function () {
        startLesson(parseInt(row.getAttribute("data-lesson-id"), 10));
      });
    });
  }

  function stepIndexOf(type, extra) {
    for (var i = 0; i < STEPS.length; i++) {
      if (STEPS[i].type === type && (extra === undefined || STEPS[i].qIndex === extra)) return i;
    }
    return 0;
  }

  function startLesson(lessonId) {
    activeLesson = LESSONS.find(function (l) { return l.id === lessonId; });
    quizAnswers = new Array(activeLesson.questions.length).fill(null);
    lastScore = null;
    STEPS = [];
    STEPS.push({ type: "overview" });
    activeLesson.sections.forEach(function (s, i) { STEPS.push({ type: "detail", index: i }); });
    STEPS.push({ type: "example" });
    STEPS.push({ type: "why" });
    activeLesson.questions.forEach(function (q, qi) { STEPS.push({ type: "question", qIndex: qi }); });
    STEPS.push({ type: "quiz-review" });
    STEPS.push({ type: "results" });
    STEPS.push({ type: "complete" });
    current = 0;
    document.getElementById("menu").style.display = "none";
    document.getElementById("wizard").style.display = "flex";
    renderStep();
  }

  function goNext() { if (current < STEPS.length - 1) { current++; renderStep(); } }
  function goBack() { if (current > 0) { current--; renderStep(); } }
  function jumpTo(idx) { current = idx; renderStep(); }

  function renderStep() {
    var step = STEPS[current];
    var wrap = document.getElementById("contentWrap");
    var nav = document.getElementById("navRow");
    var label = document.getElementById("stepLabel");
    var progressFill = document.getElementById("progressFill");
    var L = activeLesson;

    var pct = Math.round(((current + 1) / STEPS.length) * 100);
    progressFill.style.width = pct + "%";
    label.textContent = "Lesson " + String(L.id).padStart(2, "0") + " \u00b7 Step " + (current + 1) + " of " + STEPS.length;

    var backDisabled = current === 0;
    var html = "";
    var showDefaultNav = true;

    if (step.type === "overview") {
      html = '<span class="tag">Lesson ' + String(L.id).padStart(2, "0") + '</span>' +
        '<h2>' + L.title + '</h2><hr class="rule">' +
        '<p class="lede">' + L.blurb + '</p>' +
        (L.sections.length > 1 ? '<div class="outline-list">' + L.sections.map(function (s, i) {
          return '<div class="outline-item"><span class="outline-num">0' + (i + 1) + '</span><span class="outline-name">' + s.name + '</span></div>';
        }).join("") + '</div><p class="lede" style="margin-top:22px; font-size:14.5px; color:#666;">We\u2019ll go through each one in turn.</p>' : '');
    } else if (step.type === "detail") {
      var el = L.sections[step.index];
      html = '<span class="tag">' + (L.sections.length > 1 ? ("Part " + (step.index + 1) + " of " + L.sections.length) : "Key idea") + '</span>' +
        '<h2>' + el.name + '</h2><hr class="rule">' +
        '<p class="lede">' + el.definition + '</p>' +
        '<div class="detail-section"><div class="detail-label">Example</div><div class="detail-example">' + el.example + '</div></div>' +
        '<div class="detail-section pros-cons">' +
        '<div><div class="pc-heading pro">Pros</div><ul>' + el.pros.map(function (p) { return "<li>" + p + "</li>"; }).join("") + '</ul></div>' +
        '<div><div class="pc-heading con">Watch out for</div><ul>' + el.cons.map(function (c) { return "<li>" + c + "</li>"; }).join("") + '</ul></div>' +
        '</div>' +
        '<div class="detail-section"><div class="detail-label">How it fits with the rest</div><div class="differentiation-text">' + el.differentiation + '</div></div>';
    } else if (step.type === "example") {
      html = '<span class="tag">Putting it together</span>' +
        '<h2>Weak prompt vs. strong prompt</h2><hr class="rule">' +
        '<p class="lede">Examples to sit with \u2014 same principle, real situations.</p>' +
        '<table class="compare-table"><tr><th>Weak</th><th>Strong</th></tr>' +
        L.examples.map(function (ex) { return '<tr><td>' + ex.weak + '</td><td>' + ex.strong + '</td></tr>'; }).join("") +
        '</table>';
    } else if (step.type === "why") {
      showDefaultNav = false;
      html = '<span class="tag">Why it matters</span>' +
        '<h2>Wrapping up this lesson</h2><hr class="rule">' +
        '<div class="why-block"><p>' + L.why + '</p></div>' +
        '<div class="nav-row" style="padding:28px 0 0;">' +
        '<button class="btn-text" onclick="goBack()">Back</button>' +
        '<button class="btn-solid" onclick="jumpTo(stepIndexOf(\'question\', 0))">Lesson complete \u2014 start the exercise</button>' +
        '</div>';
    } else if (step.type === "question") {
      showDefaultNav = false;
      var qi = step.qIndex;
      var item = L.questions[qi];
      var isLast = qi === L.questions.length - 1;
      html = '<span class="tag">Quick check &middot; Question ' + (qi + 1) + ' of ' + L.questions.length + '</span>' +
        '<div class="quiz-question"><div class="q-title">' + item.q + '</div>' +
        item.options.map(function (opt, oi) {
          var isSelected = quizAnswers[qi] === oi;
          return '<label class="option' + (isSelected ? " selected" : "") + '" data-oi="' + oi + '">' +
            '<span class="dot"></span><span>' + opt + '</span></label>';
        }).join("") + '</div>' +
        '<div class="nav-row" style="padding:24px 0 0;">' +
        '<button class="btn-text" onclick="goBack()">Back</button>' +
        '<button class="btn-solid" id="questionNextBtn" onclick="' + (isLast ? "jumpTo(stepIndexOf('quiz-review'))" : "goNext()") + '" disabled>' +
        (isLast ? "Review answers" : "Next") + '</button></div>';
    } else if (step.type === "quiz-review") {
      showDefaultNav = false;
      html = '<span class="tag">Before you submit</span>' +
        '<h2>Review your answers</h2><hr class="rule">' +
        '<p class="lede" style="margin-bottom:6px;">Check each one \u2014 tap \u201cChange\u201d to update an answer.</p>' +
        L.questions.map(function (item, qi) {
          var picked = quizAnswers[qi] !== null ? item.options[quizAnswers[qi]] : "\u2014 not answered \u2014";
          return '<div class="review-answer-item"><div class="review-answer-row">' +
            '<div><div class="review-answer-q">' + (qi + 1) + '. ' + item.q + '</div>' +
            '<div class="review-answer-a">' + picked + '</div></div>' +
            '<a class="link-btn" onclick="jumpTo(stepIndexOf(\'question\', ' + qi + '))">Change</a></div></div>';
        }).join("") +
        '<div class="nav-row" style="padding:24px 0 0;">' +
        '<button class="btn-text" onclick="jumpTo(stepIndexOf(\'question\', ' + (L.questions.length - 1) + '))">Back</button>' +
        '<button class="btn-solid" onclick="submitQuiz()">Submit answers</button></div>';
    } else if (step.type === "results") {
      showDefaultNav = false;
      var total = L.questions.length;
      var correctCount = lastScore === null ? 0 : lastScore;
      var fraction = correctCount / total;
      var passed = fraction >= PASS_FRACTION;
      html = '<div class="score-ring-wrap"><svg viewBox="0 0 160 160"><circle class="ring-track" cx="80" cy="80" r="70"></circle>' +
        '<circle class="ring-fill ' + (passed ? "pass" : "fail") + '" id="ringFill" cx="80" cy="80" r="70"></circle></svg>' +
        '<div class="ring-center"><div class="ring-score ' + (passed ? "pass" : "fail") + '">' + correctCount + '/' + total + '</div>' +
        '<div class="ring-label">correct</div></div></div>' +
        '<h2 style="font-size:19px;">' + (passed ? "You\u2019ve got this lesson." : "Worth another pass through this lesson.") + '</h2>' +
        '<p style="max-width:420px; margin:10px auto 0; color:#555; font-size:14.5px;">' +
        "You scored " + correctCount + " out of " + total + " (" + Math.round(fraction * 100) + "%), " +
        (passed ? "above" : "below") + " the 75% pass mark" + (passed ? "." : " needed to move on.") + '</p>' +
        '<div class="review-list" id="reviewList"></div>' +
        '<div class="nav-row" style="padding:24px 0 0;">' +
        '<button class="btn-outline" onclick="jumpTo(0)">Review lesson again</button>' +
        (passed ? '<button class="btn-solid" onclick="goNext()">Finish lesson</button>' : '<button class="btn-solid" onclick="retakeQuiz()">Retake quiz</button>') +
        '</div>';
    } else if (step.type === "complete") {
      showDefaultNav = false;
      html = '<span class="tag">Nice work</span>' +
        '<h2>You\u2019ve completed Lesson ' + String(L.id).padStart(2, "0") + '</h2><hr class="rule">' +
        '<p class="lede">' + L.title + ' \u2014 done.</p>' +
        '<div class="nav-row centered-actions" style="padding:24px 0 0;">' +
        '<button class="btn-outline" onclick="retakeQuiz()">Retake quiz</button>' +
        '<button class="btn-solid" onclick="showMenu()">Back to all lessons</button></div>';
    }

    wrap.innerHTML = html;
    if (showDefaultNav) {
      nav.style.display = "flex";
      nav.innerHTML = '<button class="btn-text" onclick="goBack()" ' + (backDisabled ? "disabled" : "") + '>Back</button>' +
        '<button class="btn-solid" onclick="goNext()">Next</button>';
    } else {
      nav.style.display = "none";
      nav.innerHTML = "";
    }
    if (step.type === "question") { wireQuestionOptions(step.qIndex); }
    if (step.type === "results") { renderReview(); drawScoreRing(); }
  }

  function wireQuestionOptions(qi) {
    var wrap = document.getElementById("contentWrap");
    wrap.querySelectorAll(".option").forEach(function (label) {
      label.addEventListener("click", function () {
        quizAnswers[qi] = parseInt(label.getAttribute("data-oi"), 10);
        renderStep();
      });
    });
    var nextBtn = document.getElementById("questionNextBtn");
    if (nextBtn) nextBtn.disabled = quizAnswers[qi] === null;
  }

  function submitQuiz() {
    var correctCount = 0;
    activeLesson.questions.forEach(function (item, qi) { if (quizAnswers[qi] === item.correct) correctCount++; });
    lastScore = correctCount;
    saveProgress(activeLesson.id, correctCount, activeLesson.questions.length);
    jumpTo(stepIndexOf("results"));
  }

  function renderReview() {
    var reviewList = document.getElementById("reviewList");
    if (!reviewList) return;
    reviewList.innerHTML = activeLesson.questions.map(function (item, qi) {
      var isRight = quizAnswers[qi] === item.correct;
      return '<div class="review-item ' + (isRight ? "right" : "wrong") + '">' +
        '<span class="mark">' + (isRight ? "\u2713" : "\u2717") + '</span>' +
        '<span>Q' + (qi + 1) + ': ' + item.q + '<br><em>Correct answer: ' + item.options[item.correct] + '</em></span></div>';
    }).join("");
  }

  function drawScoreRing() {
    var circle = document.getElementById("ringFill");
    if (!circle) return;
    var total = activeLesson.questions.length;
    var correctCount = lastScore === null ? 0 : lastScore;
    var fraction = total > 0 ? correctCount / total : 0;
    var r = 70;
    var circumference = 2 * Math.PI * r;
    circle.style.transition = "none";
    circle.setAttribute("stroke-dasharray", circumference);
    circle.setAttribute("stroke-dashoffset", circumference);
    circle.getBoundingClientRect();
    requestAnimationFrame(function () {
      circle.style.transition = "";
      circle.setAttribute("stroke-dashoffset", circumference * (1 - fraction));
    });
  }

  function retakeQuiz() {
    quizAnswers = new Array(activeLesson.questions.length).fill(null);
    lastScore = null;
    jumpTo(stepIndexOf("question", 0));
  }

  function setDate() {
    var d = new Date();
    document.getElementById("dateStamp").textContent = d.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });
  }
  setDate();
  showCover();
</script>
</body>
</html>
